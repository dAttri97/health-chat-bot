spring.application.name=dattri

app.auth.api-key=${APP_AUTH_API_KEY:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/curelink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool
spring.datasource.hikari.pool-name=curelink-pool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${OPENAI_MODEL:gpt-4o}
openai.max-tokens=${OPENAI_MAX_TOKENS:1000}
openai.temperature=${OPENAI_TEMPERATURE:0.7}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}
# Disable in production; enable locally only if JVM cacerts doesn't trust OpenAI's CA
openai.skip-ssl-validation=${OPENAI_SKIP_SSL:false}

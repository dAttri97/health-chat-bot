<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disha – AI Health Coach</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #e5ddd5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: #075e54;
      color: white;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      flex-shrink: 0;
      z-index: 10;
    }
    .header-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #25d366;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
    .header-info p  { font-size: 12px; color: #b2dfdb; margin-top: 1px; }
    .header-actions { margin-left: auto; display: flex; gap: 8px; }
    .icon-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      color: white;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .icon-btn:hover { background: rgba(255,255,255,.12); }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 6px 6px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }

    /* ── Load more ── */
    .load-more-wrap {
      display: flex; justify-content: center;
      padding: 6px 0 4px;
    }
    .load-more-btn {
      background: #fff;
      border: none;
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 13px; color: #075e54;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: background .18s, transform .1s;
    }
    .load-more-btn:hover  { background: #f5f5f5; }
    .load-more-btn:active { transform: scale(.97); }
    .load-more-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Date separator ── */
    .date-sep {
      display: flex; align-items: center; justify-content: center;
      margin: 10px 0 6px;
    }
    .date-sep span {
      background: rgba(225,245,254,.92);
      color: #555; font-size: 11.5px;
      padding: 4px 14px; border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }

    /* ── Message row ── */
    .msg-row { display: flex; margin: 2px 4px; }
    .msg-row.user      { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    /* ── Bubble ── */
    .bubble {
      max-width: min(72%, 460px);
      padding: 7px 10px 20px;
      border-radius: 8px;
      position: relative;
      font-size: 14.5px; line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,.13);
      animation: pop-in .15s ease-out;
    }
    @keyframes pop-in {
      from { opacity: 0; transform: scale(.96) translateY(4px); }
      to   { opacity: 1; transform: scale(1)  translateY(0); }
    }
    .bubble.user      { background: #dcf8c6; border-top-right-radius: 2px; }
    .bubble.assistant { background: #ffffff; border-top-left-radius: 2px; }

    /* Tails */
    .bubble.user::after {
      content: '';
      position: absolute; top: 0; right: -8px;
      border-width: 0 0 8px 8px;
      border-style: solid;
      border-color: transparent transparent transparent #dcf8c6;
    }
    .bubble.assistant::after {
      content: '';
      position: absolute; top: 0; left: -8px;
      border-width: 0 8px 8px 0;
      border-style: solid;
      border-color: transparent #ffffff transparent transparent;
    }

    .bubble-content { white-space: pre-wrap; }

    .bubble-time {
      position: absolute; bottom: 4px; right: 8px;
      font-size: 10.5px; color: #999; user-select: none;
    }
    .bubble.user .bubble-time { color: #78b469; }

    /* Tick mark for sent messages */
    .bubble.user .bubble-time::after {
      content: ' ✓';
      font-size: 10px;
      color: #78b469;
    }

    /* ── Typing indicator ── */
    .typing-row { display: flex; justify-content: flex-start; margin: 4px 4px 6px; }
    .typing-bubble {
      background: #fff;
      border-radius: 8px; border-top-left-radius: 2px;
      padding: 11px 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.13);
      display: flex; gap: 5px; align-items: center;
    }
    .typing-dot {
      width: 8px; height: 8px;
      background: #90a4ae; border-radius: 50%;
      animation: bounce 1.3s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-7px); }
    }

    /* ── Input area ── */
    .input-area {
      background: #f0f0f0;
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }
    .msg-input {
      flex: 1;
      background: #fff;
      border: none; border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px; font-family: inherit;
      line-height: 1.45;
      outline: none; resize: none;
      max-height: 130px;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
      transition: box-shadow .2s;
    }
    .msg-input:focus { box-shadow: 0 1px 5px rgba(0,0,0,.18); }
    .send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: #075e54; border: none;
      cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,.2);
      transition: background .2s, transform .1s;
    }
    .send-btn:hover   { background: #128c7e; }
    .send-btn:active  { transform: scale(.93); }
    .send-btn:disabled { background: #bdbdbd; cursor: not-allowed; transform: none; }
    .send-btn svg { fill: white; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #888; text-align: center; padding: 40px 32px; gap: 14px;
    }
    .empty-state .es-icon { font-size: 52px; }
    .empty-state .es-title { font-size: 18px; font-weight: 600; color: #555; }
    .empty-state .es-sub   { font-size: 14px; line-height: 1.6; }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; backdrop-filter: blur(3px);
    }
    .modal {
      background: #fff; border-radius: 14px;
      padding: 28px 24px; width: 90%; max-width: 380px;
      box-shadow: 0 10px 32px rgba(0,0,0,.25);
      animation: slide-up .22s ease-out;
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-icon { font-size: 36px; margin-bottom: 8px; }
    .modal h2   { font-size: 19px; color: #075e54; margin-bottom: 6px; }
    .modal p    { font-size: 13.5px; color: #666; margin-bottom: 18px; line-height: 1.55; }
    .modal-input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 14px; font-family: monospace;
      outline: none; margin-bottom: 14px;
      transition: border-color .2s;
    }
    .modal-input:focus { border-color: #075e54; }
    .modal-hint { font-size: 12px; color: #999; margin-top: -8px; margin-bottom: 18px; }
    .modal-btn {
      width: 100%; padding: 13px;
      background: #075e54; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    .modal-btn:hover { background: #128c7e; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 76px; left: 50%;
      transform: translateX(-50%);
      background: #323232; color: #fff;
      padding: 10px 22px; border-radius: 22px;
      font-size: 13.5px; z-index: 300;
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      opacity: 0; transition: opacity .28s;
      pointer-events: none; white-space: nowrap;
    }
    .toast.error   { background: #c62828; }
    .toast.visible { opacity: 1; }
  </style>
</head>
<body>

<!-- ─── API Key Modal ─── -->
<div class="modal-overlay" id="apiKeyModal">
  <div class="modal">
    <div class="modal-icon">🌿</div>
    <h2>Welcome to Disha</h2>
    <p>Your personal AI health coach. Enter your API key to start chatting. It's stored only in your browser.</p>
    <input class="modal-input" type="text" id="apiKeyInput"
           placeholder="Enter API key  (e.g. my-local-key)"
           autocomplete="off" spellcheck="false" />
    <p class="modal-hint">Tip: any non-empty value works in local dev mode.</p>
    <button class="modal-btn" onclick="saveApiKey()">Start Chatting</button>
  </div>
</div>

<!-- ─── Header ─── -->
<div class="header">
  <div class="header-avatar">🌿</div>
  <div class="header-info">
    <h1>Disha</h1>
    <p id="statusText">AI Health Coach</p>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="showApiKeyModal()">⚙ API Key</button>
  </div>
</div>

<!-- ─── Chat area ─── -->
<div class="chat-area" id="chatArea"></div>

<!-- ─── Input area ─── -->
<div class="input-area">
  <textarea class="msg-input" id="msgInput"
            placeholder="Type a message…"
            rows="1"
            onkeydown="onKeyDown(event)"
            oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">
    <svg width="22" height="22" viewBox="0 0 24 24">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<!-- ─── Toast ─── -->
<div class="toast" id="toast"></div>

<script>
  /* ─── Config ─── */
  const API_BASE = 'http://localhost:8080/api/chat';
  const LS_KEY   = 'disha_api_key';
  const PAGE_SIZE = 20;

  /* ─── State ─── */
  let apiKey          = localStorage.getItem(LS_KEY) || '';
  let messages        = [];   // chronological order (oldest → newest)
  let hasMore         = false;
  let nextBeforeCursor = null;
  let isWaiting       = false;
  let typingPoll      = null;
  let toastTimer      = null;

  /* ══════════════════════════════════════════════
     INIT
  ══════════════════════════════════════════════ */
  window.addEventListener('DOMContentLoaded', () => {
    if (!apiKey) {
      show('apiKeyModal');
    } else {
      hide('apiKeyModal');
      loadInitialMessages();
    }
    document.getElementById('msgInput').focus();

    // Scroll-up triggers "load more"
    document.getElementById('chatArea').addEventListener('scroll', onChatScroll);
  });

  /* ══════════════════════════════════════════════
     API KEY MODAL
  ══════════════════════════════════════════════ */
  function showApiKeyModal() {
    document.getElementById('apiKeyInput').value = apiKey;
    show('apiKeyModal');
  }

  function saveApiKey() {
    const val = document.getElementById('apiKeyInput').value.trim();
    if (!val) { showToast('Please enter an API key', true); return; }
    apiKey = val;
    localStorage.setItem(LS_KEY, apiKey);
    hide('apiKeyModal');
    resetChat();
    loadInitialMessages();
  }

  /* ══════════════════════════════════════════════
     API HELPERS
  ══════════════════════════════════════════════ */
  async function apiFetch(path, opts = {}) {
    const res = await fetch(API_BASE + path, {
      ...opts,
      headers: {
        'X-API-Key': apiKey,
        'Content-Type': 'application/json',
        ...(opts.headers || {}),
      },
    });
    if (res.status === 401) throw new Error('Invalid API key — please update it via ⚙ API Key.');
    if (!res.ok) {
      let msg = `Server error (${res.status})`;
      try { const body = await res.json(); msg = body.message || msg; } catch (_) {}
      throw new Error(msg);
    }
    return res.json();
  }

  /* ══════════════════════════════════════════════
     LOAD MESSAGES
  ══════════════════════════════════════════════ */
  async function loadInitialMessages() {
    setStatus('Loading…');
    try {
      const data = await apiFetch(`/messages?limit=${PAGE_SIZE}`);
      // API returns newest-first; reverse to chronological
      messages         = [...data.messages].reverse();
      hasMore          = data.hasMore;
      nextBeforeCursor = data.nextBefore;
      renderAll();
      scrollToBottom(false);
      setStatus('AI Health Coach');
    } catch (e) {
      setStatus('Offline');
      showToast(e.message, true);
    }
  }

  async function loadMoreMessages() {
    if (!hasMore || !nextBeforeCursor) return;
    const btn = document.getElementById('loadMoreBtn');
    if (btn) btn.disabled = true;

    const chatArea       = document.getElementById('chatArea');
    const prevScrollHeight = chatArea.scrollHeight;

    try {
      const data = await apiFetch(
        `/messages?limit=${PAGE_SIZE}&before=${encodeURIComponent(nextBeforeCursor)}`
      );
      const older      = [...data.messages].reverse();
      hasMore          = data.hasMore;
      nextBeforeCursor = data.nextBefore;
      messages         = [...older, ...messages];
      renderAll();
      // Keep viewport stable after prepend
      chatArea.scrollTop = chatArea.scrollHeight - prevScrollHeight;
    } catch (e) {
      showToast(e.message, true);
      if (btn) btn.disabled = false;
    }
  }

  /* ══════════════════════════════════════════════
     SEND MESSAGE
  ══════════════════════════════════════════════ */
  async function sendMessage() {
    if (isWaiting) return;
    const input   = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content) return;

    input.value = '';
    autoResize(input);
    isWaiting = true;
    setSendDisabled(true);

    // Optimistic render
    const tempId  = `temp-${Date.now()}`;
    const tempMsg = { id: tempId, role: 'USER', content, createdAt: new Date().toISOString(), pending: true };
    messages.push(tempMsg);
    renderAll();
    scrollToBottom(true);

    showTypingIndicator();
    startTypingPoll();

    try {
      const reply = await apiFetch('/messages', {
        method: 'POST',
        body: JSON.stringify({ content }),
      });

      // Replace temp with confirmed user msg + assistant reply
      messages = messages.filter(m => m.id !== tempId);
      messages.push({ id: `u-${Date.now()}`, role: 'USER', content, createdAt: new Date().toISOString() });
      messages.push({ ...reply, role: normaliseRole(reply.role) });

      stopTypingPoll();
      hideTypingIndicator();
      renderAll();
      scrollToBottom(true);
    } catch (e) {
      messages = messages.filter(m => m.id !== tempId);
      stopTypingPoll();
      hideTypingIndicator();
      renderAll();
      showToast(e.message, true);
    } finally {
      isWaiting = false;
      setSendDisabled(false);
      input.focus();
    }
  }

  /* ══════════════════════════════════════════════
     TYPING INDICATOR POLL
  ══════════════════════════════════════════════ */
  function startTypingPoll() {
    if (typingPoll) return;
    typingPoll = setInterval(async () => {
      try {
        const data = await apiFetch('/typing');
        if (data.typing) showTypingIndicator();
        else hideTypingIndicator();
      } catch (_) {}
    }, 1000);
  }

  function stopTypingPoll() {
    clearInterval(typingPoll);
    typingPoll = null;
  }

  /* ══════════════════════════════════════════════
     RENDER
  ══════════════════════════════════════════════ */
  function renderAll() {
    const chatArea = document.getElementById('chatArea');
    chatArea.innerHTML = '';

    if (hasMore) {
      const wrap = document.createElement('div');
      wrap.className = 'load-more-wrap';
      wrap.innerHTML = `<button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreMessages()">
        ↑ Load earlier messages
      </button>`;
      chatArea.appendChild(wrap);
    }

    if (messages.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <div class="es-icon">🌿</div>
        <div class="es-title">Hi, I'm Disha!</div>
        <div class="es-sub">Your personal AI health coach.<br>Ask me anything about your health.</div>`;
      chatArea.appendChild(empty);
      return;
    }

    let lastDate = null;
    for (const msg of messages) {
      const dateLabel = formatDateLabel(msg.createdAt);
      if (dateLabel !== lastDate) {
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.innerHTML = `<span>${dateLabel}</span>`;
        chatArea.appendChild(sep);
        lastDate = dateLabel;
      }
      chatArea.appendChild(makeBubble(msg));
    }
  }

  function makeBubble(msg) {
    const role  = normaliseRole(msg.role);
    const isUser = role === 'USER';
    const row   = document.createElement('div');
    row.className = `msg-row ${isUser ? 'user' : 'assistant'}`;
    row.dataset.msgId = msg.id;

    const bubble = document.createElement('div');
    bubble.className = `bubble ${isUser ? 'user' : 'assistant'}`;
    if (msg.pending) bubble.style.opacity = '0.65';

    const content = document.createElement('span');
    content.className = 'bubble-content';
    content.textContent = msg.content;
    bubble.appendChild(content);

    const time = document.createElement('span');
    time.className = 'bubble-time';
    time.textContent = formatTime(msg.createdAt);
    bubble.appendChild(time);

    row.appendChild(bubble);
    return row;
  }

  function showTypingIndicator() {
    if (document.getElementById('typingIndicator')) return;
    const chatArea = document.getElementById('chatArea');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    chatArea.appendChild(row);
    scrollToBottom(true);
  }

  function hideTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  /* ══════════════════════════════════════════════
     SCROLL
  ══════════════════════════════════════════════ */
  function scrollToBottom(smooth) {
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
  }

  function onChatScroll() {
    const chatArea = document.getElementById('chatArea');
    if (chatArea.scrollTop < 60 && hasMore) loadMoreMessages();
  }

  /* ══════════════════════════════════════════════
     HELPERS
  ══════════════════════════════════════════════ */
  function resetChat() {
    messages        = [];
    hasMore         = false;
    nextBeforeCursor = null;
    document.getElementById('chatArea').innerHTML = '';
  }

  function normaliseRole(r) {
    return (r || '').toUpperCase();
  }

  function formatTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDateLabel(iso) {
    if (!iso) return 'Today';
    const d    = new Date(iso);
    const now  = new Date();
    const diff = Math.floor((now - d) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function onKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 130) + 'px';
  }

  function setSendDisabled(v) {
    document.getElementById('sendBtn').disabled = v;
  }

  function setStatus(text) {
    document.getElementById('statusText').textContent = text;
  }

  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('error', isError);
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), 4000);
  }

  function show(id) { document.getElementById(id).style.display = 'flex'; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
